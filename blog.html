<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog - Zivya Enterprises</title>
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="blog.html">
<div id="header-placeholder"></div>
<main>
  <div class="page-header"><div class="container"><p class="page-header-tag">Insights & Stories</p><h1>Our Blog</h1><p class="page-header-sub">Stories about craft, sustainability, design trends, and the people behind every piece.</p></div></div>
  <section class="blog-section container" id="blog-content"></section>
  <section class="newsletter-section"><div class="container" style="max-width:36rem;text-align:center">
    <p class="section-tag">Stay Updated</p>
    <h2 style="font-family:Georgia,serif;color:#fff;font-size:1.5rem;margin-bottom:1rem">Subscribe to Our Newsletter</h2>
    <p style="color:#A89880;font-size:.875rem;margin-bottom:1.5rem">Get the latest articles, product launches, and design inspiration delivered to your inbox.</p>
    <div class="newsletter-form"><input type="email" placeholder="Enter your email address"><button>Subscribe</button></div>
  </div></section>
</main>
<div id="footer-placeholder"></div>
<script src="js/icons.js"></script><script src="js/layout.js"></script>
<script>
document.addEventListener('DOMContentLoaded',function(){
  const catColors={Craftsmanship:'#4A6741',Sustainability:'#2E6B5E','Design Trends':'#C9A84C','Our Story':'#8B5E3C','Interior Tips':'#5A4A8A'};
  const posts=[
    {id:1,title:'The Art of Rattan Weaving: A Tradition Worth Preserving',excerpt:'Explore the centuries-old craft of rattan weaving and how Zivya Enterprises is keeping this tradition alive through sustainable practices and skilled artisan training.',category:'Craftsmanship',author:'Arjun Sharma',date:'April 18, 2024',readTime:'5 min read',image:'https://images.unsplash.com/photo-1674159085094-6f1874d7767c?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=800',featured:true},
    {id:2,title:'Sustainable Materials: Why We Choose Natural Over Synthetic',excerpt:'A deep dive into the materials we use — rattan, bamboo, jute, and seagrass — and why choosing natural is not just better for the planet, but for your space too.',category:'Sustainability',author:'Priya Mehta',date:'March 30, 2024',readTime:'4 min read',image:'https://images.unsplash.com/photo-1760182200277-fae00dfb149f?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=600',featured:false},
    {id:3,title:'Lighting Design Trends 2024: What\'s Hot in Handcrafted Décor',excerpt:'From organic pendant clusters to minimalist bamboo sconces — discover the top lighting trends shaping interiors globally.',category:'Design Trends',author:'Ravi Gupta',date:'March 15, 2024',readTime:'6 min read',image:'https://images.unsplash.com/photo-1697963793926-84cd35e224fb?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=600',featured:false},
    {id:4,title:'Moradabad: The Craft Capital of the World',excerpt:'Discover the story of Moradabad — India\'s brass city and the heartland of handcrafted export goods.',category:'Our Story',author:'Arjun Sharma',date:'February 28, 2024',readTime:'7 min read',image:'https://images.unsplash.com/photo-1763978485095-1cd13f4d3cb3?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=600',featured:false},
    {id:5,title:'How to Style Your Home with Natural Handcrafted Décor',excerpt:'Simple, expert-approved tips for incorporating handcrafted woven pieces, natural planters, and artisan lighting into any interior style.',category:'Interior Tips',author:'Priya Mehta',date:'February 10, 2024',readTime:'5 min read',image:'https://images.unsplash.com/photo-1760981348070-ffa100647759?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&q=80&w=600',featured:false}
  ];
  const featured=posts.find(p=>p.featured);
  const rest=posts.filter(p=>!p.featured);
  let html='';
  if(featured){
    html+=`<div class="featured-post"><div class="img-wrap"><img src="${featured.image}" alt="${featured.title}"></div><div class="content"><div class="cat-badge" style="background:${catColors[featured.category]||'#C9A84C'}">${featured.category}</div><h2 style="font-family:Georgia,serif">${featured.title}</h2><p class="excerpt">${featured.excerpt}</p><div class="post-meta"><span>${icon('user',12)} ${featured.author}</span><span>${icon('clock',12)} ${featured.readTime}</span></div><button class="link-gold">Read Article ${icon('arrowRight',13)}</button></div></div>`;
  }
  html+=`<div class="posts-grid">${rest.map(p=>`<article class="post-card"><div class="img-wrap"><img src="${p.image}" alt="${p.title}"></div><div class="cat-badge" style="background:${catColors[p.category]||'#C9A84C'}">${p.category}</div><h3 style="font-family:Georgia,serif">${p.title}</h3><p class="excerpt line-clamp-3">${p.excerpt}</p><div class="meta"><span>${icon('clock',10)} ${p.readTime}</span><span>${icon('tag',10)} ${p.date}</span></div></article>`).join('')}</div>`;
  document.getElementById('blog-content').innerHTML=html;
});
</script>
</body>
</html>
